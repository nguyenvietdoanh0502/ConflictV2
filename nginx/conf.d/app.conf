server {
    listen 80;
    server_name unisync.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"unisync-gateway"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unisync.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/unisync.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unisync.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Sử dụng Docker DNS resolver nội bộ để tự động cập nhật IP khi container backend khởi động lại
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Chặn truy cập từ bên ngoài Internet vào các endpoint nội bộ giữa các microservice
    location ^~ /api/v1/internal/ {
        default_type application/json;
        return 403 '{"code":403,"status":"error","message":"Forbidden internal endpoint"}';
    }

    location /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # WebSocket & SockJS STOMP Endpoint (/ws và /ws-sockjs)
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"unisync-gateway"}';
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"UP","message":"UniSync Cloud API Gateway (HTTPS) is running securely"}';
    }
}
